events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Khai báo tường minh định dạng log chuẩn (giống khuôn mẫu 'combined' mặc định của NGINX)
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    # Vị trí lưu file log mặc định của NGINX: /var/log/nginx/access.log
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # Route xem trực tiếp báo cáo HTML do GoAccess xuất ra
        location = /nginx-report {
            alias /usr/share/nginx/html/report.html;
            default_type text/html;
        }

        # Reverse Proxy: Chuyển tiếp mọi truy cập từ NGINX (cổng 8080) sang ExpressJS (cổng 3000)
        location / {
            proxy_pass http://host.docker.internal:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
